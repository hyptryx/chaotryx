<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>CHAOTRYX – Neon Rage Gaming</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@300;400;700&display=swap" rel="stylesheet">

  <!-- Twitch Script -->
  <script src="https://embed.twitch.tv/embed/v1.js"></script>

  <style>
    /* ===========================
       CHAOTRYX BRANDING VARIABLEN
       =========================== */
    :root {
      --red: #ff1a3c;
      --red-soft: rgba(255, 26, 60, 0.4);
      --white: #f5f5f5;
      --gray: #9e9e9e;
      --bg-dark: #050507;
      --bg-panel: #0b0b10;
      --border: #1c1c22;
      --shadow-red: 0 0 22px rgba(255, 26, 60, 0.9);
    }

    /* ===========================
       GLOBAL
       =========================== */
    body {
      background: radial-gradient(circle at top, #1a0f14 0%, #050507 60%);
      background-attachment: fixed;
      color: var(--white);
      font-family: 'Rajdhani', sans-serif;
      margin: 0;
      padding: 0;
    }

    .page {
      max-width: 1250px;
      margin: 0 auto;
      padding: 20px;
    }

    a { color: inherit; text-decoration: none; }

    /* ===========================
       HEADER / LOGO
       =========================== */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand-logo {
      width: 90px;
      height: 90px;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid var(--red);
      box-shadow: var(--shadow-red);
      background: #000;
    }

    .brand-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .brand-name {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--red);
      text-shadow: var(--shadow-red);
    }

    .brand-tagline {
      font-size: 0.9rem;
      color: var(--gray);
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    /* ===========================
       LIVE STATUS
       =========================== */
    .status-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #0a0a0f;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      font-size: 0.85rem;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: var(--gray);
      transition: 0.3s;
    }

    .status-pill.live .status-dot {
      background: var(--red);
      box-shadow: var(--shadow-red);
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.25); }
      100% { transform: scale(1); }
    }

    /* ===========================
       PANELS
       =========================== */
    .card {
      background: linear-gradient(135deg, #0b0b10, #050507);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.03), 0 0 40px rgba(0,0,0,0.8);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: -40%;
      background: radial-gradient(circle at top left, rgba(255, 26, 60, 0.18), transparent 60%);
      pointer-events: none;
    }

    .card-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--red);
      margin-bottom: 12px;
    }

    /* ===========================
       TWITCH PLAYER + CHAT
       =========================== */
    .top-section {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
    }

    #twitch-embed {
      width: 100%;
      height: 100%;
      aspect-ratio: 16/9;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--red-soft);
      box-shadow: var(--shadow-red);
    }

    #twitch-chat-embed {
      width: 100%;
      height: 100%;
      min-height: 400px;
      border-radius: 12px;
      border: 1px solid var(--red-soft);
      overflow: hidden;
    }

    /* ===========================
       ABOUT ME
       =========================== */
    .about-layout {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid var(--red);
      box-shadow: var(--shadow-red);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .about-text h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.4rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--red);
    }

    .about-text p {
      color: var(--gray);
      font-size: 1rem;
      line-height: 1.6;
    }

    /* ===========================
       SOCIAL BUTTONS
       =========================== */
    .social-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #0a0a0f;
      color: var(--gray);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      transition: 0.25s;
      cursor: pointer;
    }

    .social-btn:hover {
      color: var(--red);
      border-color: var(--red);
      box-shadow: var(--shadow-red);
      transform: translateY(-2px);
    }

    .social-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--red);
      box-shadow: var(--shadow-red);
    }

    /* ===========================
       FOOTER
       =========================== */
    footer {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,0.05);
      color: var(--gray);
      font-size: 0.8rem;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>

<body>
  <div class="page">

    <!-- HEADER -->
    <header>
      <div class="brand">
        <div class="brand-logo">
          <img src="images/logo.png" alt="CHAOTRYX Logo">
        </div>
        <div>
          <div class="brand-name">CHAOTRYX</div>
          <div class="brand-tagline">Zu laut. Zu ehrlich.</div>
        </div>
      </div>

      <div class="status-pill" id="live-status">
        <div class="status-dot"></div>
        <span>Status: Offline</span>
      </div>
    </header>

    <!-- TOP SECTION -->
    <section class="top-section">
      <div class="card">
        <div class="card-title">Live Stream</div>
        <div id="twitch-embed"></div>
      </div>

      <div class="card">
        <div class="card-title">Chat</div>
        <iframe
          id="twitch-chat-embed"
          src="https://www.twitch.tv/embed/chaotryx/chat?parent=www.chaotryx.at"
          frameborder="0">
        </iframe>
      </div>
    </section>

    <!-- ABOUT + SOCIALS -->
    <section style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:20px;">
      <div class="card">
        <div class="card-title">Über mich</div>
        <div class="about-layout">
          <div class="avatar">
            <img src="images/profile.jpeg" alt="Profilbild">
          </div>
          <div class="about-text">
            <h2>Chris aka Chaotryx</h2>
            <p>
              25 Jahre alt. Twitch Streamer seit 1 Jahr.  
              Gaming ohne Filter. Zu laut. Zu ehrlich.  
              Willkommen im Chaos.
            </p>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Socials</div>
        <a class="social-btn" href="https://www.twitch.tv/chaotryx" target="_blank">
          <span class="social-dot"></span> Twitch
        </a><br><br>
        <a class="social-btn" href="https://www.tiktok.com/@chaotryx" target="_blank">
          <span class="social-dot"></span> TikTok
        </a>
      </div>
    </section>

    <!-- FOOTER -->
    <footer>
      <div>© <span id="year"></span> CHAOTRYX</div>
      <div>Neon Rage Gaming</div>
    </footer>

  </div>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    // Twitch Player
    new Twitch.Embed("twitch-embed", {
      width: "100%",
      height: "100%",
      channel: "chaotryx",
      layout: "video",
      autoplay: true,
      parent: ["www.chaotryx.at", "chaotryx.at", "localhost"]
    });

    // Live Status (Heuristik)
    const statusEl = document.getElementById("live-status");
    const dot = statusEl.querySelector(".status-dot");
    const text = statusEl.querySelector("span");

    window.addEventListener("message", (event) => {
      if (typeof event.data === "string" && event.data.includes("PLAYING")) {
        statusEl.classList.add("live");
        text.textContent = "Status: Live";
      }
    });
  </script>

</body>
</html>
